[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "credb-crawler-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
credb-crawler = "crawler_agent.services.crawler:CrawlerAgentService"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler_agent*"]
