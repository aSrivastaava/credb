<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CredB Nexus</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#080a12;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{text-align:center;padding:48px 40px;border:1px solid rgba(59,130,246,.2);border-radius:20px;background:rgba(59,130,246,.04);max-width:440px}
  .icon{font-size:48px;margin-bottom:20px}
  h1{font-size:2rem;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:8px}
  .sub{font-size:13px;color:#3b82f6;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
  p{font-size:14px;color:#64748b;line-height:1.8}
  .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pulse 2s infinite;margin-right:8px}
  .status{display:inline-flex;align-items:center;margin-top:24px;font-size:12px;color:#f59e0b;font-weight:600}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🗄️</div>
  <h1>CredB Nexus</h1>
  <div class="sub">Distributed File Indexing</div>
  <p>Offline-first distributed file indexing and intelligent retrieval platform. Backend under active development.</p>
  <div class="status"><span class="dot"></span>Backend in development</div>
</div>
</body>
</html>
